name: Python tests

# Reusable: the pytest suite (unit + in-memory integration) with the locked dependencies.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Python · tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # lint installs only Ruff, tests the full lockfile: separate caches keep both complete.
          cache-suffix: tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --no-sync pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 14
