name: Ruff

on:
  push:
    branches:
      - dev
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
