name: Docker image

# Reusable: builds the bot image once, pushes it to GHCR, then scans that exact
# image for known vulnerabilities. Every build is also tagged sha-<commit> so a
# release can later promote this same image instead of rebuilding it.
on:
  workflow_call:
    inputs:
      tags:
        description: "Extra docker/metadata-action tag rules, one per line (sha-<commit> is always added)"
        type: string
        required: true
      version:
        description: "Value baked into the image as VERSION"
        type: string
        required: true
    outputs:
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/amirkenzo/pasarguardbot

jobs:
  build:
    name: Docker · build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            ${{ inputs.tags }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pasarguardbot
          cache-to: type=gha,mode=max,scope=pasarguardbot
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Docker image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Docker · vulnerability scan
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Report-only: findings go to the repository Security tab instead of failing
      # the run, so a new upstream CVE never blocks shipping an unrelated fix.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: docker-image
