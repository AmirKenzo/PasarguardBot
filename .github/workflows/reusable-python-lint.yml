name: Python lint

# Reusable: Ruff lint and format check, then a compile pass over the sources.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Python · lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # lint installs only Ruff, tests the full lockfile: separate caches keep both complete.
          cache-suffix: lint

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install Ruff (dev group only)
        run: uv sync --frozen --only-group dev --no-install-project

      - name: Ruff check
        run: uv run --no-sync ruff check --output-format=github

      - name: Ruff format
        run: uv run --no-sync ruff format --check

      - name: Compile sources
        run: python -m compileall -q app main.py config.py
