name: Feature request
description: Suggest an improvement or new feature
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you want and why it helps.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve?
      placeholder: As an admin/user, I need...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - User bot menus
        - Admin panel
        - Payments / gateway
        - Install / Docker / CLI
        - Docs
        - Other
    validations:
      required: true
