name: Bug report
description: Report a bug in PasarguardBot
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear and short description of the problem.
      placeholder: What went wrong?
    validations:
      required: true

  - type: dropdown
    id: install-mode
    attributes:
      label: Install mode
      options:
        - Docker
        - Native (script / uv)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Bot version or image tag (e.g. 1.3.0, latest, dev).
      placeholder: 1.3.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps so we can reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact tokens and secrets).
      render: shell
    validations:
      required: false
